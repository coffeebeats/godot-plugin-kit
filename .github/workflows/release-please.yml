name: "🚀 Release: Plugin version"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4

    outputs:
      release-created: ${{ steps.release.outputs.releases_created }}
      release-tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          config-file: .release-please/config.json
          manifest-file: .release-please/manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # NOTE: The agent plugin is served from 'main' at this tag, so a consumer's
      # '.claude/settings.json' follows the major line the way the workflows do.
      - name: Publish major tag
        if: steps.release.outputs.releases_created == 'true'
        shell: bash
        run: |
          # See https://github.com/orgs/community/discussions/26560#discussioncomment-3531273
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Delete existing tag
          git tag -d v${{ steps.release.outputs.major }} || :
          git push origin :v${{ steps.release.outputs.major }} || :

          # Create new/updated major tag
          git tag -a v${{ steps.release.outputs.major }} -m "chore: release v${{ steps.release.outputs.major }}"
          git push origin v${{ steps.release.outputs.major }}

  # NOTE: A 'workflow_dispatch' run republishes the dispatched ref without a tag.
  publish:
    needs: ["release-please"]
    if: |
      !failure() && !cancelled() && (
        needs.release-please.outputs.release-created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true

      - name: Determine the addon subfolder
        id: subfolder
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          NAME="${REPOSITORY#*/}"
          echo "value=${NAME#godot-plugin-}" >> "$GITHUB_OUTPUT"

      - uses: coffeebeats/godot-infra/actions/package-addon@v6
        with:
          subfolder: ${{ steps.subfolder.outputs.value }}
          tag: ${{ needs.release-please.outputs.release-tag && format('dist/{0}', needs.release-please.outputs.release-tag) || '' }}
          file-excludes: |
            **/AGENTS.md
            **/CLAUDE.md
            **/pyproject.toml
            **/uv.lock

            **/example
            **/examples
            **/*_test.gd
            **/*_test.gd.uid

            icon.svg
            icon.svg.import

            tools
            **/*.po
            **/*.pot

            plugins

  branch_protection:
    needs: ["release-please", "publish"]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
