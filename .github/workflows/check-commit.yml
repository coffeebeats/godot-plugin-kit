name: "🔎 Check: Godot project"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    uses: coffeebeats/godot-infra/.github/workflows/check-project.yaml@v6
    secrets: inherit

  # NOTE: Dependencies run downward only, and the addon never names the game. The
  # reusable workflow has no hook for a project-specific rule, so these live here.
  layering:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify the platform layer does not depend on the system layer
        run: |
          if grep -rn 'res://system/' platform/; then
            echo "::error::'platform/' may not reference 'system/'."
            exit 1
          fi

          # NOTE: A global class is reached by bare name, which the path check above
          # cannot see, so each name the system layer declares is checked too.
          for name in $(grep -rh '^class_name' --include='*.gd' system/ | awk '{print $2}'); do
            if grep -rnw "$name" --include='*.gd' --include='*.tscn' --include='*.tres' platform/; then
              echo "::error::'platform/' may not reference '$name', declared in 'system/'."
              exit 1
            fi
          done

      - name: Verify the addon does not reference a consuming game
        run: |
          if grep -rn 'res://project/' --include='*.gd' --include='*.tscn' --include='*.tres' --exclude-dir=addons .; then
            echo "::error::Nothing in this addon may reference 'res://project/'."
            exit 1
          fi

  # NOTE: This job name is required by the branch ruleset.
  branch_protection:
    needs: [check, layering]
    if: ${{ always() }}

    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Verify status of dependencies
        if: |
          always() &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
